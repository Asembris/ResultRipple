name: Pages

# The write-up in blog/, published at https://asembris.github.io/ResultRipple/.
# Pull requests run the checks only; a push to main runs them, then deploys blog/.

on:
  pull_request:
    branches: [main]
    paths: ["blog/**"]
  push:
    branches: [main]
    paths: ["blog/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check the write-up against docs/evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check.py confirms that every commit the page links to exists.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: story.json matches docs/evidence
        run: python blog/tools/extract_story.py --check
      - name: Fallback figures match story.json
        run: python blog/tools/build_figures.py --check
      - name: Page checks
        run: python blog/tools/check.py
      - name: Independent verifier on the committed editions
        run: python blog/tools/reverify.py

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: blog
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
