[project]
name = "resultripple-backend"
version = "0.1.0"
description = "ResultRipple API: evidence-connected publishing over FalkorDB"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "falkordb==1.0.10",
    "jinja2==3.1.5",
    "itsdangerous==2.2.0",
    "openai==1.109.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
