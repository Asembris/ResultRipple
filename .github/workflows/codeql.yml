name: CodeQL

# Static analysis of the backend (Python) and the frontend (TypeScript) with the
# default CodeQL query suite. Neither language needs a build (build-mode: none).
# Alerts land in the repository's code scanning view; this workflow is separate
# from ci.yml so a scanning outage never blocks the product checks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@v3.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v3.39.0
        with:
          category: "/language:${{ matrix.language }}"
