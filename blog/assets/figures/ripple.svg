<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 586" width="1200" height="586" role="img" aria-labelledby="t d">
<title id="t">The ripple: three memberships move and every registered use of the finding is out of date</title>
<desc id="d">B09, B10 and B11 move from South to Pilot. South goes from $3.60 over 7 batches to $4.40 over 4; North stays at $4.00. The shared finding goes from South 40¢ cheaper to South 40¢ more expensive, and both reports and the proposal are out of date.</desc>
