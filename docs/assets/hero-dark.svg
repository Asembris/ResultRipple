<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
<title id="t">ResultRipple: one evidence correction, every registered use, the right reviewer</title>
<desc id="d">Batches B09 to B11 move from South to Pilot. The shared finding reverses from South 40 cents cheaper to 40 cents more expensive than North. The change reaches the Operations Cost Review, the South Expansion Memo and the South lane expansion proposal. Review authority moves from Noor Haddad to Sam Oyelaran, so Noor's approved plan v1 is refused with AUTHORITY_CHANGED. Sam approves plan v2 and Version 2 is issued.</desc>
